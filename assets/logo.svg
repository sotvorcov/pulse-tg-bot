<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b24"/>
      <stop offset="0.55" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a3a4d" stop-opacity="0.5"/>
      <stop offset="0.62" stop-color="#101821" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d68a"/>
      <stop offset="0.5" stop-color="#e8b563"/>
      <stop offset="1" stop-color="#caa24d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- кольцо -->
  <g fill="none" stroke="url(#gold)" filter="url(#soft)">
    <circle cx="256" cy="256" r="152" stroke-width="6" opacity="0.9"/>
    <circle cx="256" cy="256" r="178" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- пульс-волна (ЭКГ) -->
  <path d="M120 256 H196 L214 256 L232 198 L252 322 L272 150 L292 306 L310 256 H392"
        fill="none" stroke="url(#gold)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <!-- точка-импульс -->
  <circle cx="392" cy="256" r="10" fill="url(#gold)" filter="url(#soft)"/>
</svg>
