<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset="1" stop-color="#f1e9db"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9962e"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#96690f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#b8860b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- кольцо -->
  <g fill="none" stroke="url(#gold)">
    <circle cx="256" cy="256" r="152" stroke-width="6" opacity="0.95"/>
    <circle cx="256" cy="256" r="178" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- пульс-волна -->
  <path d="M120 256 H196 L214 256 L232 198 L252 322 L272 150 L292 306 L310 256 H392"
        fill="none" stroke="url(#gold)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <circle cx="392" cy="256" r="10" fill="url(#gold)"/>
</svg>
