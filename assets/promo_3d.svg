<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#151d28"/>
      <stop offset="55%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBE08A"/>
      <stop offset="48%" stop-color="#F0C24B"/>
      <stop offset="100%" stop-color="#C9922E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1219"/>
      <stop offset="100%" stop-color="#080c11"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="26" stdDeviation="38" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="26%" r="60%">
      <stop offset="0%" stop-color="#F0C24B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F0C24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <polyline points="0,232 360,232 420,232 455,140 500,336 545,84 590,300 630,206 680,232 1200,232"
            fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.10"
            stroke-linejoin="round" stroke-linecap="round"/>

  <g text-anchor="middle">
    <text x="600" y="140" font-size="98" font-weight="bold" fill="url(#gold)" letter-spacing="6">PULSE</text>
    <text x="600" y="196" font-size="32" fill="#c3ccd6">Claude Code прямо в Telegram — вайбкодинг без ПК</text>
  </g>

  <!-- ============ ЗАДНИЙ ТЕЛЕФОН: открытая сессия (чат) ============ -->
  <g transform="rotate(7 900 760)" filter="url(#shadow)">
    <rect x="712" y="316" width="384" height="892" rx="54" fill="#0d131b" stroke="url(#gold)" stroke-width="2.5" stroke-opacity="0.65"/>
    <rect x="728" y="332" width="352" height="860" rx="42" fill="url(#screen)"/>
    <!-- header сессии -->
    <rect x="728" y="332" width="352" height="82" fill="#111823"/>
    <circle cx="772" cy="373" r="20" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <polyline points="757,373 767,373 773,358 780,390 787,352 793,386 799,373 789,373"
              fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <text x="806" y="368" font-size="25" font-weight="bold" fill="#eef2f6">Деплой прода</text>
    <text x="806" y="394" font-size="17" fill="#8b95a1">сессия · opus</text>
    <!-- сообщения -->
    <rect x="748" y="440" width="250" height="56" rx="16" fill="#141c25"/>
    <text x="766" y="475" font-size="19" fill="#d7dee6">Задеплой и прогони тесты</text>
    <!-- voice -->
    <rect x="820" y="512" width="240" height="52" rx="16" fill="#2a2413" stroke="url(#gold)" stroke-width="1.4" stroke-opacity="0.5"/>
    <circle cx="848" cy="538" r="12" fill="url(#gold)"/><rect x="845.5" y="532" width="5" height="12" rx="2.5" fill="#0d131b"/>
    <g fill="#f0c24b">
      <rect x="868" y="533" width="3.5" height="10" rx="1.7"/><rect x="875" y="528" width="3.5" height="20" rx="1.7"/>
      <rect x="882" y="523" width="3.5" height="30" rx="1.7"/><rect x="889" y="530" width="3.5" height="16" rx="1.7"/>
      <rect x="896" y="526" width="3.5" height="24" rx="1.7"/><rect x="903" y="533" width="3.5" height="10" rx="1.7"/>
    </g>
    <text x="1042" y="543" font-size="17" text-anchor="end" fill="#f4e6be">0:08</text>
    <!-- bot + код -->
    <rect x="748" y="584" width="300" height="104" rx="16" fill="#141c25"/>
    <text x="766" y="618" font-size="19" fill="#d7dee6">Деплой пошёл, гоняю тесты…</text>
    <rect x="766" y="632" width="262" height="42" rx="9" fill="#0a1017"/>
    <text x="780" y="660" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#7fd08a">$ pytest -q · 42 passed</text>
    <!-- final -->
    <rect x="748" y="708" width="322" height="56" rx="16" fill="#141c25"/>
    <text x="766" y="743" font-size="19" fill="#d7dee6">Готово. Прод обновлён.</text>
    <!-- чип стоимости -->
    <rect x="748" y="788" width="158" height="38" rx="12" fill="#141c25"/>
    <text x="768" y="813" font-size="16" fill="#8b95a1">0.03$ · opus · 12с</text>
    <!-- поле ввода -->
    <rect x="728" y="1104" width="352" height="70" fill="#111823"/>
    <rect x="748" y="1120" width="262" height="40" rx="20" fill="#0a1017"/>
    <text x="766" y="1146" font-size="17" fill="#6f7a86">напиши или надиктуй…</text>
    <circle cx="1046" cy="1140" r="21" fill="url(#gold)"/><rect x="1043.5" y="1130" width="5" height="13" rx="2.5" fill="#0d131b"/>
    <path d="M1037 1144 a9 9 0 0 0 18 0" fill="none" stroke="#0d131b" stroke-width="2.3"/>
  </g>

  <!-- ============ ПЕРЕДНИЙ ТЕЛЕФОН: список тем = сессии ============ -->
  <g transform="rotate(-6 500 850)" filter="url(#shadow)">
    <rect x="266" y="378" width="476" height="946" rx="60" fill="#0d131b" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.75"/>
    <rect x="282" y="394" width="444" height="914" rx="46" fill="url(#screen)"/>
    <rect x="452" y="414" width="104" height="16" rx="8" fill="#05070a"/>

    <!-- header группы -->
    <rect x="282" y="440" width="444" height="92" fill="#111823"/>
    <circle cx="332" cy="486" r="25" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <polyline points="313,486 325,486 332,468 340,506 348,458 355,500 361,486 349,486"
              fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="376" y="480" font-size="29" font-weight="bold" fill="#eef2f6">Pulse</text>
    <text x="376" y="510" font-size="19" fill="#8b95a1">супергруппа · Темы</text>

    <!-- пилюля-подпись -->
    <rect x="304" y="552" width="400" height="46" rx="23" fill="#1a2230" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="504" y="581" text-anchor="middle" font-size="21" fill="#f0c24b">Каждая тема — отдельная сессия</text>

    <!-- строки-сессии -->
    <g font-size="24">
      <!-- 1 -->
      <circle cx="330" cy="662" r="22" fill="#2f9e6b"/>
      <text x="372" y="654" font-weight="bold" fill="#eef2f6">Деплой прода</text>
      <text x="372" y="686" font-size="20" fill="#8b95a1">Готово. Прод обновлён.</text>
      <text x="700" y="648" font-size="17" text-anchor="end" fill="#7a8490">22:14</text>
      <circle cx="686" cy="680" r="15" fill="url(#gold)"/><text x="686" y="686" font-size="17" text-anchor="middle" fill="#0d131b">2</text>
      <line x1="372" y1="712" x2="704" y2="712" stroke="#1b2330" stroke-width="1.5"/>
      <!-- 2 -->
      <circle cx="330" cy="762" r="22" fill="#3d7fd6"/>
      <text x="372" y="754" font-weight="bold" fill="#eef2f6">Парсер Wildberries</text>
      <text x="372" y="786" font-size="20" fill="#8b95a1">Спарсил 1200 SKU в таблицу</text>
      <text x="700" y="748" font-size="17" text-anchor="end" fill="#7a8490">21:40</text>
      <line x1="372" y1="812" x2="704" y2="812" stroke="#1b2330" stroke-width="1.5"/>
      <!-- 3 -->
      <circle cx="330" cy="862" r="22" fill="#8a63d6"/>
      <text x="372" y="854" font-weight="bold" fill="#eef2f6">Лендинг клиенту</text>
      <text x="372" y="886" font-size="20" fill="#8b95a1">Секция цен добавлена</text>
      <text x="700" y="848" font-size="17" text-anchor="end" fill="#7a8490">20:05</text>
      <circle cx="686" cy="880" r="15" fill="url(#gold)"/><text x="686" y="886" font-size="17" text-anchor="middle" fill="#0d131b">1</text>
      <line x1="372" y1="912" x2="704" y2="912" stroke="#1b2330" stroke-width="1.5"/>
      <!-- 4 -->
      <circle cx="330" cy="962" r="22" fill="#d6a53d"/>
      <text x="372" y="954" font-weight="bold" fill="#eef2f6">Сервер / DevOps</text>
      <text x="372" y="986" font-size="20" fill="#8b95a1">Диск почищен, бэкап ок</text>
      <text x="700" y="948" font-size="17" text-anchor="end" fill="#7a8490">18:22</text>
      <line x1="372" y1="1012" x2="704" y2="1012" stroke="#1b2330" stroke-width="1.5"/>
      <!-- 5 -->
      <circle cx="330" cy="1062" r="22" fill="#d65b5b"/>
      <text x="372" y="1054" font-weight="bold" fill="#eef2f6">Бот на aiogram</text>
      <text x="372" y="1086" font-size="20" fill="#8b95a1">Хендлер оплаты готов</text>
      <text x="700" y="1048" font-size="17" text-anchor="end" fill="#7a8490">16:50</text>
      <line x1="372" y1="1112" x2="704" y2="1112" stroke="#1b2330" stroke-width="1.5"/>
      <!-- 6 -->
      <circle cx="330" cy="1162" r="22" fill="#39b0a5"/>
      <text x="372" y="1154" font-weight="bold" fill="#eef2f6">Идеи и заметки</text>
      <text x="372" y="1186" font-size="20" fill="#8b95a1">Список фич на неделю</text>
      <text x="700" y="1148" font-size="17" text-anchor="end" fill="#7a8490">Пн</text>
    </g>

    <!-- поле ввода -->
    <rect x="282" y="1236" width="444" height="72" fill="#111823"/>
    <rect x="302" y="1252" width="352" height="42" rx="21" fill="#0a1017"/>
    <text x="320" y="1279" font-size="19" fill="#6f7a86">напиши или надиктуй…</text>
    <circle cx="694" cy="1273" r="23" fill="url(#gold)"/><rect x="691" y="1263" width="6" height="14" rx="3" fill="#0d131b"/>
    <path d="M684 1277 a10 10 0 0 0 20 0" fill="none" stroke="#0d131b" stroke-width="2.5"/>
  </g>

  <!-- низ -->
  <g text-anchor="middle">
    <text x="600" y="1404" font-size="26" fill="#aeb8c2">Темы = сессии · голос · параллельно · RU/EN · open-source · MIT</text>
    <text x="600" y="1452" font-size="30" font-weight="bold" fill="url(#gold)">github.com/sotvorcov/pulse-tg-bot</text>
  </g>
</svg>
